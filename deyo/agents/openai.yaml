interface:
  display_name: "Deyo"
  short_description: "用 deyo CLI 转写链接或本地音视频，处理 API key、格式、进度与排查"
  default_prompt: "Use $deyo to install or run the deyo CLI for link transcription or a single local media upload, configure API key auth, choose text/SRT/VTT/JSON output, use jsonl progress, use --base-url http://deyo.mac-studio only for explicit local/dev requests, and troubleshoot common failures."

policy:
  allow_implicit_invocation: true
