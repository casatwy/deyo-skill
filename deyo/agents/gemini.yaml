interface:
  display_name: "Deyo"
  short_description: "用 deyo CLI 转写链接或本地音视频，处理 API key、格式、进度与排查"
  default_prompt: "Use the deyo skill to install or run the deyo CLI for link transcription or a single local media upload, configure API key auth, choose text/SRT/VTT/JSON output, use jsonl progress, use --base-url http://deyo.mac-studio only for explicit local/dev requests, and troubleshoot common failures."

# Gemini CLI 原生支持基于 SKILL.md 的加载方式。
# Gemini 依靠 SKILL.md 顶部的 YAML frontmatter（包含 name 和 description）来识别和触发 skill。
# 本文件用于与 claude.yaml 和 openai.yaml 保持平行结构，记录 Gemini 侧的说明。
gemini_cli:
  skill_id: "deyo"
  notes:
    - "Gemini CLI 原生读取 SKILL.md，只要包含 name 和 description frontmatter 即可。"
    - "安装方式：在 Gemini CLI 中执行：gemini skills install <path/to/deyo> --scope workspace|user"
    - "安装后，用户需在交互式会话中执行 /skills reload 生效。"
    - "运行 deyo 前必须具备 API key；普通情况使用默认生产服务，只有用户明确要求本地/开发环境时才传 --base-url http://deyo.mac-studio。"
