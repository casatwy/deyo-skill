interface:
  display_name: "Deyo"
  short_description: "用 deyo CLI 转写链接或本地音视频，流式整理正文并安全交付 TXT"
  default_prompt: "Use the deyo skill to transcribe a link or one local media file. For non-raw text, require CLI 0.2.0+, stream numbered cleaned paragraphs, handle resets, rebuild from private final raw, and publish with the bundled atomic no-clobber helper. Preserve SRT/VTT/JSON and explicit raw exactly."

# Gemini CLI 通过官方 Git extension 加载 skills/deyo，并在安装时开启 auto-update。
gemini_cli:
  skill_id: "deyo"
  extension: "https://github.com/casatwy/deyo-skill.git"
  primary_install: "deyo skill install --platform gemini"
  notes:
    - "推荐安装方式：deyo skill install --platform gemini；等价原生命令为 gemini extensions install https://github.com/casatwy/deyo-skill.git --auto-update。"
    - "不固定 --ref，不主动添加 --consent；更新后重启 Gemini CLI。"
    - "统一安装入口只支持 user scope；如需限制某个 workspace，应使用 Gemini Extension 自身的 enable / disable 配置，不要改用旧的 Skill 子目录安装。"
    - "运行 deyo 前必须具备 API key；普通情况使用默认生产服务，只有用户明确要求本地/开发环境时才传 --base-url http://deyo.mac-studio。"
    - "整理纯文本时要求 deyo CLI 0.2.0+，并使用 --stream-transcript 与 --progress-format jsonl；最终文件必须从权限受限的终态 raw 重新完整整理。"
