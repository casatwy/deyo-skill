interface:
  display_name: "Deyo"
  short_description: "用 deyo CLI 转写链接或本地音视频，流式整理正文并安全交付 TXT"
  default_prompt: "Use the deyo skill to transcribe a link or one local media file. For non-raw text, require CLI 0.2.0+, stream numbered cleaned paragraphs, handle resets, rebuild from private final raw, and publish with the bundled atomic no-clobber helper. Preserve SRT/VTT/JSON and explicit raw exactly."

# Claude 通过 Deyo 官方 Git marketplace 安装 plugin，并为 marketplace 开启自动更新。
# legacy ~/.claude/skills 只允许在官方历史哈希完全匹配时迁移。
claude_code:
  skill_id: "deyo"
  primary_install: "deyo skill install --platform claude"
  marketplace: "casatwy/deyo-skill"
  plugin: "deyo@deyo-official"
  auto_update: true
  invocation:
    # Claude Code 主要靠 SKILL.md 的 frontmatter description 触发，
    # 用户也可以通过 /deyo 直接显式调用。
    slash_command: "/deyo"
    implicit: true
  required_tools:
    - Bash
  notes:
    - "SKILL.md 的 frontmatter 已符合 Claude Code skill 规范，无需额外转换。"
    - "推荐安装方式：deyo skill install --platform claude；它合并官方 Git marketplace、安装 deyo@deyo-official 并设置 autoUpdate: true。"
    - "同名 marketplace 异源时拒绝覆盖；legacy 目录只有官方历史哈希完全匹配时才允许事务式迁移。"
    - "更新后执行 /reload-plugins 或开启新会话。"
    - "如果 claude plugin install 失败，保留原始错误并停止，不要修改全局 git、SSH 或 npm 配置。"
    - "整理纯文本时要求 deyo CLI 0.2.0+，并通过 --stream-transcript 与 --progress-format jsonl 消费稳定正文事件。"
    - "CLI 只写权限受限的临时 Whisper 原稿；Claude 依据终态原稿重新整理，并使用 bundled helper 原子 no-clobber 发布 cleaned TXT；并发占位或悬空 symlink 不得覆盖。"

policy:
  allow_implicit_invocation: true
